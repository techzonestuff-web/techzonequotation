<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GST Calculator & PC Build Estimator</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #d9d9d9;
      font-weight: bold;
      border-radius: 8px;
    }

    .tab-btn.active {
      background: #007bff;
      color: white;
    }

    .page {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .page.active {
      display: block;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
      line-height: 1.8;
    }

    .item-row {
      display: grid;
      grid-template-columns: 2fr 2fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: end;
    }

    .remove-btn {
      background: red;
      padding: 10px;
      width: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    table th {
      background: #007bff;
      color: white;
    }

    .grand-total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      color: #007bff;
    }

    @media(max-width:768px){
      .item-row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showPage('gstPage', this)">
      GST Calculator
    </button>

    <button class="tab-btn" onclick="showPage('pcPage', this)">
      PC Build Estimator
    </button>
  </div>

  <!-- GST PAGE -->
  <div class="page active" id="gstPage">
    <h2>GST Calculator</h2>

    <label>Select Calculation Type</label>
    <select id="mode">
      <option value="add">Add GST to Amount</option>
      <option value="remove">Find Actual Cost from GST Included Amount</option>
    </select>

    <label>Amount (₹)</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <label>GST Rate (%)</label>
    <input type="number" id="gst" placeholder="Enter GST percentage">

    <button onclick="calculateGST()">Calculate GST</button>

    <div class="result" id="gstResult">
      Result will appear here
    </div>
  </div>

  <!-- PC BUILD PAGE -->
  <div class="page" id="pcPage">
    <h2>Custom PC Build Estimator</h2>

    <div id="itemsContainer"></div>

    <button onclick="addItem()">+ Add Component</button>
    <button onclick="generateEstimate()">Generate Estimate</button>

    <div id="estimateOutput"></div>
  </div>

</div>

<script>

  // TAB SWITCHING
  function showPage(pageId, btn) {
    document.querySelectorAll('.page').forEach(page => {
      page.classList.remove('active');
    });

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');
    btn.classList.add('active');
  }

  // GST CALCULATOR
  function calculateGST() {

    const mode = document.getElementById("mode").value;
    const amount = parseFloat(document.getElementById("amount").value);
    const gstRate = parseFloat(document.getElementById("gst").value);
    const resultDiv = document.getElementById("gstResult");

    if (isNaN(amount) || isNaN(gstRate)) {
      resultDiv.innerHTML = "Please enter valid numbers.";
      return;
    }

    let gstAmount, total, basePrice;

    if (mode === "add") {

      gstAmount = (amount * gstRate) / 100;
      total = amount + gstAmount;

      resultDiv.innerHTML = `
        Actual Price: <b>₹${amount.toFixed(2)}</b><br>
        GST Amount (${gstRate}%): <b>₹${gstAmount.toFixed(2)}</b><br>
        Total Price with GST: <b>₹${total.toFixed(2)}</b>
      `;

    } else {

      basePrice = amount / (1 + gstRate / 100);
      gstAmount = amount - basePrice;

      resultDiv.innerHTML = `
        GST Included Price: <b>₹${amount.toFixed(2)}</b><br>
        Actual Price Before GST: <b>₹${basePrice.toFixed(2)}</b><br>
        GST Amount (${gstRate}%): <b>₹${gstAmount.toFixed(2)}</b>
      `;
    }
  }

  // COMPONENT LIST
  const componentOptions = [
    "Processor (CPU)",
    "Motherboard",
    "Memory (RAM)",
    "Solid State Drive (SSD)",
    "Hard Disk Drive (HDD)",
    "Graphics Card (GPU)",
    "Power Supply (PSU)",
    "Cabinet / Chassis",
    "CPU Cooler / Liquid Cooler",
    "Monitor",
    "Laptop",
    "Desktop PC (Branded)",
    "All-in-One PC",
    "Keyboard & Mouse",
    "UPS / Inverter",
    "Networking (Router/Switch)",
    "Printer / Scanner",
    "Cables / Adapters / Converters",
    "Speakers / Headsets",
    "Webcam / Mic",
    "External Storage",
    "Operating System (Windows)",
    "Antivirus / Software",
    "Service / Labor / Assembly",
    "Annual Maintenance (AMC)",
    "Other (Type in Spec)"
  ];

  // ADD ITEM ROW
  function addItem() {

    const container = document.getElementById("itemsContainer");

    const row = document.createElement("div");
    row.className = "item-row";

    let optionsHTML = "";

    componentOptions.forEach(item => {
      optionsHTML += `<option value="${item}">${item}</option>`;
    });

    row.innerHTML = `
      <div>
        <label>Category</label>
        <select class="category">
          ${optionsHTML}
        </select>
      </div>

      <div>
        <label>Specification / Model</label>
        <input type="text" class="spec" placeholder="Example: Intel i7 14700K">
      </div>

      <div>
        <label>Qty</label>
        <input type="number" class="qty" value="1">
      </div>

      <div>
        <label>Rate (₹)</label>
        <input type="number" class="rate" value="0">
      </div>

      <button class="remove-btn" onclick="this.parentElement.remove()">
        X
      </button>
    `;

    container.appendChild(row);
  }

  // GENERATE ESTIMATE
  function generateEstimate() {

    const rows = document.querySelectorAll(".item-row");

    let html = `
      <table>
        <tr>
          <th>Category</th>
          <th>Specification</th>
          <th>Qty</th>
          <th>Rate</th>
          <th>Total</th>
        </tr>
    `;

    let grandTotal = 0;

    rows.forEach(row => {

      const category = row.querySelector(".category").value;
      const spec = row.querySelector(".spec").value;
      const qty = parseFloat(row.querySelector(".qty").value) || 0;
      const rate = parseFloat(row.querySelector(".rate").value) || 0;

      const total = qty * rate;
      grandTotal += total;

      html += `
        <tr>
          <td>${category}</td>
          <td>${spec}</td>
          <td>${qty}</td>
          <td>₹${rate.toFixed(2)}</td>
          <td>₹${total.toFixed(2)}</td>
        </tr>
      `;
    });

    html += `</table>`;

    html += `
      <div class="grand-total">
        Grand Total: ₹${grandTotal.toFixed(2)}
      </div>
    `;

    document.getElementById("estimateOutput").innerHTML = html;
  }

  // DEFAULT FIRST ROW
  addItem();

</script>

</body>
</html>
